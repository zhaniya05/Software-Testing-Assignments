name: Playwright Tests
on:
  push: # every push to every branch
  pull_request: # every PR
  workflow_dispatch: # manual runs for timing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # caches ~/.npm keyed on package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # The public toolshop sits behind Cloudflare, which serves a bot challenge to
      # GitHub runners. So each shard runs its own copy of the app (same recipe as the
      # project's own CI: docker-compose.yml, sprint5, migrate + seed).
      - name: Checkout the app under test
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop
      - name: Start the app
        working-directory: toolshop
        env:
          SPRINT: sprint5
          DISABLE_LOGGING: "true"
        run: docker compose -f docker-compose.yml up -d --force-recreate
      - name: Prepare the app (dependencies, database)
        working-directory: toolshop
        env:
          SPRINT: sprint5
          DISABLE_LOGGING: "true"
        run: |
          docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi
          for i in $(seq 1 30); do
            docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null && break
            echo "waiting for MariaDB ($i/30)"; sleep 2
          done
          docker compose exec -T laravel-api php artisan migrate:refresh --seed
      - name: Wait for UI and API
        run: |
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:4200 && curl -sf -o /dev/null "http://localhost:8091/products?page=1"; then
              echo "app is up"; exit 0
            fi
            echo "waiting for app ($i/90)"; sleep 5
          done
          docker compose -f toolshop/docker-compose.yml logs --tail=80 || true
          exit 1
      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8091
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1 # intermediate file
      - name: Upload traces and JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: |
            test-results/
            reports/
          retention-days: 14

  merge-reports:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into HTML + JUnit
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Upload merged JUnit
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit-merged.xml
          retention-days: 14
